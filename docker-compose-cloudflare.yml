services:
  conectasti-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ConectaSTI
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CONECTASTI_DB_PASSWORD:?Set CONECTASTI_DB_PASSWORD in .env}
    ports:
      - "15435:5432"
    volumes:
      - conectasti_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ConectaSTI"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  bifrostauth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authsti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BIFROSTAUTH_DB_PASSWORD:?Set BIFROSTAUTH_DB_PASSWORD in .env}
    ports:
      - "15436:5432"
    volumes:
      - bifrostauth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authsti"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  bifrostauth:
    build:
      context: ../BifrostAuth
      dockerfile: Dockerfile
    image: conectasti-bifrostauth:local
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=bifrostauth-db;Port=5432;Database=authsti;Username=postgres;Password=${BIFROSTAUTH_DB_PASSWORD:?Set BIFROSTAUTH_DB_PASSWORD in .env}
      Jwt__Key: ${JWT_SECRET:?Set JWT_SECRET in .env}
      Jwt__Issuer: BifrostAuth
      Jwt__Audience: BifrostAuth
      Migrations__RunOnStartup: "true"
      NHibernate__SchemaUpdateEnabled: "false"
      NHibernate__ShowSql: "false"
      NHibernate__FormatSql: "false"
      NHibernate__AdoNetBatchSize: "20"
      Seed__Admin__Enabled: "true"
      Seed__Admin__Login: ${BIFROST_ADMIN_LOGIN:?Set BIFROST_ADMIN_LOGIN in .env}
      Seed__Admin__Email: ${BIFROST_ADMIN_EMAIL:?Set BIFROST_ADMIN_EMAIL in .env}
      Seed__Admin__Password: ${BIFROST_ADMIN_PASSWORD:?Set BIFROST_ADMIN_PASSWORD in .env}
      Seed__Application__Enabled: "true"
      Seed__Application__Name: ConectaSTI
      Seed__Application__ClientId: ${BIFROST_APP_CLIENT_ID:?Set BIFROST_APP_CLIENT_ID in .env}
      Seed__Application__ClientSecret: ${BIFROST_APP_CLIENT_SECRET:?Set BIFROST_APP_CLIENT_SECRET in .env}
      Seed__Application__RedirectUrl: ${CONECTASTI_PUBLIC_URL:?Set CONECTASTI_PUBLIC_URL in .env}/callback
    ports:
      - "18080:8080"
    depends_on:
      bifrostauth-db:
        condition: service_healthy
    restart: unless-stopped

  conectasti-api:
    build:
      context: ./ConectaSTI.Backend
      dockerfile: ConectaSTI/ConectaSTI.Api/Dockerfile
    image: conectasti-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=conectasti-db;Port=5432;Database=ConectaSTI;User Id=postgres;Password=${CONECTASTI_DB_PASSWORD:?Set CONECTASTI_DB_PASSWORD in .env}
      MigrateDb: "true"
      BifrostAuth__JwtKey: ${JWT_SECRET:?Set JWT_SECRET in .env}
      BifrostAuth__Issuer: BifrostAuth
      BifrostAuth__ClientId: ${BIFROST_APP_CLIENT_ID:?Set BIFROST_APP_CLIENT_ID in .env}
    ports:
      - "15055:8080"
    depends_on:
      conectasti-db:
        condition: service_healthy
    restart: unless-stopped

  conectasti-rotas:
    build:
      context: ./ConectaSTI.Backend
      dockerfile: ConectaSTI/ConectaSTI.Rotas/Dockerfile
    image: conectasti-rotas:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=conectasti-db;Port=5432;Database=ConectaSTI;User Id=postgres;Password=${CONECTASTI_DB_PASSWORD:?Set CONECTASTI_DB_PASSWORD in .env}
      ExecutionEngine: http://conectasti-api:8080
      MigrateDb: "false"
    ports:
      - "15184:8080"
    depends_on:
      conectasti-db:
        condition: service_healthy
      conectasti-api:
        condition: service_started
    restart: unless-stopped

  conectasti-frontend:
    build:
      context: ./ConectaSTI.Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://conectasti-api:8080
        NEXT_PUBLIC_BIFROST_URL: ${BIFROST_PUBLIC_URL:?Set BIFROST_PUBLIC_URL in .env}
        NEXT_PUBLIC_CLIENT_ID: ${BIFROST_APP_CLIENT_ID:?Set BIFROST_APP_CLIENT_ID in .env}
        NEXT_PUBLIC_REDIRECT_URL: ${CONECTASTI_PUBLIC_URL:?Set CONECTASTI_PUBLIC_URL in .env}/callback
        NEXT_PUBLIC_BIFROST_RESPONSE_TYPE: token
        NEXT_PUBLIC_USE_MOCK: "false"
        JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    image: conectasti-frontend:local
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      NEXT_PUBLIC_API_URL: http://conectasti-api:8080
      NEXT_PUBLIC_BIFROST_URL: ${BIFROST_PUBLIC_URL:?Set BIFROST_PUBLIC_URL in .env}
      NEXT_PUBLIC_CLIENT_ID: ${BIFROST_APP_CLIENT_ID:?Set BIFROST_APP_CLIENT_ID in .env}
      NEXT_PUBLIC_REDIRECT_URL: ${CONECTASTI_PUBLIC_URL:?Set CONECTASTI_PUBLIC_URL in .env}/callback
      NEXT_PUBLIC_BIFROST_RESPONSE_TYPE: token
      NEXT_PUBLIC_USE_MOCK: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "13000:3000"
    depends_on:
      conectasti-api:
        condition: service_started
      bifrostauth:
        condition: service_started
    restart: unless-stopped

  nginx-proxy:
    image: nginx:alpine
    container_name: conectasti-nginx
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - conectasti-frontend
      - conectasti-api
      - conectasti-rotas
      - bifrostauth
    networks:
      - default

volumes:
  conectasti_db_data:
  bifrostauth_db_data:
