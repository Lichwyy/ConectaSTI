events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off valid=30s;

    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 8081;
        server_name ~^conectasti-auth\..+$;

        location / {
            set $upstream_bifrostauth http://bifrostauth:8080;
            add_header X-ConectaSTI-Upstream bifrostauth always;
            proxy_pass $upstream_bifrostauth;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8081;
        server_name ~^conectasti-api\..+$;

        location / {
            set $upstream_conectasti_api http://conectasti-api:8080;
            add_header X-ConectaSTI-Upstream conectasti-api always;
            proxy_pass $upstream_conectasti_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8081;
        server_name ~^conectasti-rotas\..+$;

        location / {
            set $upstream_conectasti_rotas http://conectasti-rotas:8080;
            add_header X-ConectaSTI-Upstream conectasti-rotas always;
            proxy_pass $upstream_conectasti_rotas;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8081 default_server;
        server_name ~^conectasti\..+$ _;

        location /api/backend/ {
            set $upstream_conectasti_frontend http://conectasti-frontend:3000;
            add_header X-ConectaSTI-Upstream conectasti-frontend always;
            proxy_pass $upstream_conectasti_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/ {
            set $upstream_conectasti_frontend http://conectasti-frontend:3000;
            add_header X-ConectaSTI-Upstream conectasti-frontend always;
            proxy_pass $upstream_conectasti_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /callback {
            set $upstream_conectasti_frontend http://conectasti-frontend:3000;
            add_header X-ConectaSTI-Upstream conectasti-frontend always;
            proxy_pass $upstream_conectasti_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            set $upstream_conectasti_frontend http://conectasti-frontend:3000;
            add_header X-ConectaSTI-Upstream conectasti-frontend always;
            proxy_pass $upstream_conectasti_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
